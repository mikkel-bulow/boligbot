name: Boligbot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: boligbot
  cancel-in-progress: false

jobs:
  tjek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer
        run: |
          # Prøv op til 3 gange, så et kortvarigt netværksbump ikke får kørslen til at fejle
          for i in 1 2 3; do
            pip install -r requirements.txt && python -m playwright install --with-deps chromium && break
            if [ "$i" = 3 ]; then exit 1; fi
            echo "Installationen fejlede - prøver igen om 15 sekunder ($i/3)"
            sleep 15
          done

      - name: Koer boligbot
        env:
          BOLIG_NAVN: ${{ secrets.BOLIG_NAVN }}
          BOLIG_TELEFON: ${{ secrets.BOLIG_TELEFON }}
          BOLIG_EMAIL: ${{ secrets.BOLIG_EMAIL }}
          BOLIG_ANTAL_BEBOERE: ${{ secrets.BOLIG_ANTAL_BEBOERE }}
          BOLIG_HVEM: ${{ secrets.BOLIG_HVEM }}
          BOLIG_BESKED: ${{ secrets.BOLIG_BESKED }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python bot.py

      - name: Gem hvilke boliger der er set
        if: always()
        run: |
          git config user.name "boligbot"
          git config user.email "boligbot@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || (git commit -m "Opdater sete boliger" && (git push || (git pull --rebase && git push)))
