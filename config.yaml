# Boligbot – indstillinger (ingen personlige oplysninger her; de ligger som GitHub Secrets)

# true = udfyld formularen og tag et skærmbillede, men tryk IKKE send.
# Sæt til false, når du har set prøve-mailen og er tilfreds.
dry_run: false

# Postnumre der skrives op til automatisk.
# K + Christianshavn (1000-1499), V (1500-1799), Frederiksberg (1800-2000), Ø (2100, 2150), N (2200)
postnr_ranges:
  - [1000, 2000]
  - [2100, 2100]
  - [2150, 2150]
  - [2200, 2200]

max_husleje: 15550      # kr./md. uden a conto
min_vaerelser: 2

# Taurus har ingen formular – du får kun en mail om nye boliger i disse bydele.
taurus_bydele:
  - "København K"
  - "København V"
  - "København N"
  - "København Ø"
  - "Frederiksberg"

# Wanamove: man køber en ansøgning, så du får kun en mail om nye boliger.
# Samme pris- og værelsesgrænse som ovenfor. Bydele genkendes på navn:
wanamove_bydele:
  - "Indre By"
  - "København K"
  - "Kbh K"
  - "Christianshavn"
  - "Vesterbro"
  - "København V"
  - "Kbh V"
  - "Frederiksberg"
  - "Nørrebro"
  - "København N"
  - "Kbh N"
  - "Østerbro"
  - "København Ø"
  - "Kbh Ø"

# Automatisk tilmelding pr. udlejer. Cityapartment afviser robotter (reCAPTCHA v3),
# så dér får du kun en mail med det samme og skriver dig selv op.
auto_tilmelding:
  Kereby: true
  Cityapartment: false

# Kereby beder dig bekræfte nogle udsagn, før du kan bestille en fremvisning.
# Botten bekræfter kun disse tre (du har sagt, at de passer på dig). Spørger en bolig om
# noget andet, stopper botten og mailer dig, så du selv kan tage stilling.
# Botten vælger altid den første ledige dato og det første tidspunkt.
kereby_bekraeft:
  ikke_rki: true          # "Jeg bekræfter, at jeg ikke er registreret i RKI."
  ingen_kaeledyr: true    # "Jeg bekræfter, at jeg ikke har nogen kæledyr."
  max_personer: true      # "... ikke skal bo mere end N personer" – kun hvis jeres antal (BOLIG_ANTAL_BEBOERE) er højst N

# Sikkerhedsgrænse: højst så mange tilmeldinger pr. kørsel
max_tilmeldinger_pr_koersel: 3
